name: 'CI'

on:
  push:
    paths-ignore:
      - 'build/**'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'build/**'
      - '.editorconfig'
      - '.gitattributes'
      - 'LICENSE'
      - 'README.md'

jobs:
  parallel-lint:
    name: 'ParallelLint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
      - name: Run ParallelLint
        run: composer parallel-lint -- --no-progress --ignore-fails

  psalm:
    name: 'Psalm'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
      - name: Run Psalm
        run: composer psalm -- --show-info=false --no-progress --no-suggestions --no-cache

  rector:
    name: 'Rector'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
      - name: Run Rector
        run: composer rector:diff -- --no-progress-bar --clear-cache

  php-cs-fixer:
    name: 'PHPCsFixer'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
      - name: Run PHPCsFixer
        run: composer php-cs-fixer:diff -- --no-interaction --using-cache=no

  phpunit:
    name: 'PHPUnit'
    needs: ['parallel-lint', 'psalm', 'rector', 'php-cs-fixer']
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system:
          - 'ubuntu-latest'
          - 'windows-latest'
        php-version:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        composer-dependency:
          - 'lowest'
          - 'highest'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.composer-dependency }}
      - name: Run PHPUnit
        run: composer --no-interaction phpunit -- --do-not-cache-result
